<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07182e">
  <meta name="description" content="Lorenzo El Pescador: pesca sportiva, tecniche di pesca e fauna ittica. Seguimi su YouTube e TikTok.">
  <title>Lorenzo El Pescador 🎣</title>
  <style>
    :root {color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    * {box-sizing:border-box}
    body {margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 5%,#174a71 0%,#0b2945 40%,#061527 100%);color:#fff;padding:32px 20px}
    main {width:min(100%,440px);text-align:center}
    .logo {display:block;width:min(78vw,280px);height:auto;margin:0 auto 12px;filter:drop-shadow(0 12px 28px #0008)}
    h1 {font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.15;margin:10px 0 12px}
    p {line-height:1.6;color:#c5deef;margin:0 auto 26px;max-width:34ch}
    .links {display:grid;gap:14px}
    a {display:flex;justify-content:center;align-items:center;gap:12px;min-height:60px;padding:12px 20px;border:1px solid #ffffff40;border-radius:16px;color:white;text-decoration:none;font-size:1.13rem;font-weight:750;box-shadow:0 5px 18px #0004;transition:transform .15s,background .15s}
    a:hover {transform:translateY(-2px)}a:focus-visible{outline:3px solid #5ee4ff;outline-offset:4px}
    .youtube {background:#c91925}.youtube:hover{background:#e52230}
    .tiktok {background:#121722}.tiktok:hover{background:#253041}
    .symbol {font-size:1.4rem;line-height:1}
    footer {font-size:.8rem;color:#a8c2d5;margin-top:30px}
    @media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Logo Lorenzo El Pescador: giovane pescatore e pesce serra" width="1254" height="1254">
    <h1>Lorenzo El Pescador</h1>
    <p>Pesca sportiva, tecniche di pesca e curiosità sulla fauna ittica. Ci vediamo in acqua! 🎣</p>
    <nav class="links" aria-label="Canali social">
      <a class="youtube" href="https://www.youtube.com/@FishyFishy24" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">▶</span> YouTube</a>
      <a class="tiktok" href="https://www.tiktok.com/@FishyFishy24" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">♪</span> TikTok</a>
    </nav>
    <footer>© Lorenzo El Pescador</footer>
  </main>
</body>
</html>
